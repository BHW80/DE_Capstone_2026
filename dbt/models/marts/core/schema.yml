version: 2

models:
  - name: dim_video
    description: "SCD-2 Dimension für YouTube-Videos mit historisierten Stammdaten."
    columns:
      - name: video_key
        tests:
          - unique
          - not_null
      - name: video_id
        tests:
          - not_null

  - name: dim_category
    description: "Conformed Dimension für Video-Kategorien."
    columns:
      - name: category_key
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Kimball Datumsdimension mit vorberechneten Kalenderattributen."
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: fact_video_metrics
    description: "Faktentabelle mit täglichen Interaktionskennzahlen und SCD-2 Verknüpfung."
    columns:
      - name: metric_key
        tests:
          - unique
          - not_null
      - name: video_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_video')
              field: video_key
      - name: category_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_category')
              field: category_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
