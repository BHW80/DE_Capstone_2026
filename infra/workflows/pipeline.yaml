# =============================================================================
# Google Cloud Workflows: Full End-to-End Serverless Lakehouse & DWH Pipeline
# Architektur-Pattern B: Cloud Workflows steuert den Ablauf, waehrend die
# komplexe SQL-Transformationslogik sauber in BigQuery Stored Procedures
# (infra/sql/*.sql -> google_bigquery_routine) gekapselt ist.
# =============================================================================
main:
  params: [args]
  steps:
    - init_constants:
        assign:
          - project_id: "cloudanalytics-514018"
          - dataset_id: "youtube_analytics"
          - bucket_uri: "gs://lakehouse-youtube-cloudanalytics-514018/silver/*.parquet"

    # 1. Cloud-to-Cloud Load: GCS Silver Parquet -> BigQuery silver_videos
    - prepare_load_query:
        assign:
          - l_p1: ${"LOAD DATA OVERWRITE `" + project_id + "." + dataset_id + ".silver_videos` "}
          - l_p2: ${"FROM FILES (format = 'PARQUET', uris = ['" + bucket_uri + "'])"}
          - load_query: ${l_p1 + l_p2}

    - load_gcs_silver_to_bq:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project_id}
          body:
            query: ${load_query}
            useLegacySql: false
        result: load_result

    # 2. Pruefe, ob Daten im Silver-Layer vorhanden sind
    - check_silver_data:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project_id}
          body:
            query: ${"SELECT count(*) as total_records FROM `" + project_id + "." + dataset_id + ".silver_videos`"}
            useLegacySql: false
        result: silver_check_result

    # 3. Baue Staging View (stg_videos) via Stored Procedure (infra/sql/01_sp_build_stg_videos.sql)
    - build_stg_videos:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project_id}
          body:
            query: ${"CALL `" + project_id + "." + dataset_id + ".sp_build_stg_videos`();"}
            useLegacySql: false
        result: stg_result

    # 4. Baue alle 3 Kimball-Dimensionen (dim_category, dim_date, dim_video SCD-2)
    #    via Stored Procedure (infra/sql/02_sp_build_dimensions.sql)
    - build_dimensions_scd2:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project_id}
          body:
            query: ${"CALL `" + project_id + "." + dataset_id + ".sp_build_dimensions`();"}
            useLegacySql: false
        result: dims_result

    # 5. Baue Faktentabelle (fact_video_metrics mit Point-in-Time Join)
    #    via Stored Procedure (infra/sql/03_sp_refresh_fact_table.sql)
    - refresh_fact_table:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project_id}
          body:
            query: ${"CALL `" + project_id + "." + dataset_id + ".sp_refresh_fact_table`();"}
            useLegacySql: false
        result: fact_refresh_result

    # 6. DataOps Quality Gate: Pruefe auf verwaiste Fremdschluessel (Orphan Keys)
    - quality_gate_validation:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project_id}
          body:
            query: ${"SELECT count(*) as invalid_keys FROM `" + project_id + "." + dataset_id + ".fact_video_metrics` f LEFT JOIN `" + project_id + "." + dataset_id + ".dim_video` v ON f.video_key = v.video_key WHERE v.video_key IS NULL"}
            useLegacySql: false
        result: quality_result

    - get_quality_result:
        assign:
          - invalid_count: ${int(quality_result.rows[0].f[0].v)}

    - evaluate_quality_gate:
        switch:
          - condition: ${invalid_count > 0}
            raise: ${"Quality Gate FAILED! Found " + string(invalid_count) + " orphan records in fact_video_metrics."}

    - finish_success:
        return:
          status: "SUCCESS"
          message: "Full End-to-End Cloud Lakehouse & Star-Schema Pipeline (Pattern B: Stored Procedures) completed successfully. 0 quality errors detected."
